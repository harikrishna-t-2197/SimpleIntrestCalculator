<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f7fb">
    <title>Simple Interest Calculator</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #17243b;
        background: #f4f7fb;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px 18px;
        background:
          radial-gradient(ellipse at 10% 12%, rgb(91 141 239 / 10%), transparent 38%),
          radial-gradient(ellipse at 90% 90%, rgb(53 183 154 / 10%), transparent 36%),
          #f4f7fb;
      }

      main {
        width: min(100%, 480px);
      }

      .eyebrow {
        margin: 0 0 10px;
        color: #5174b9;
        font-size: 0.75rem;
        font-weight: 750;
        letter-spacing: 0.14em;
        text-align: center;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.8rem, 7vw, 2.35rem);
        letter-spacing: -0.045em;
        text-align: center;
      }

      .intro {
        margin: 10px 0 26px;
        color: #65728a;
        line-height: 1.55;
        text-align: center;
      }

      .calculator {
        padding: clamp(22px, 6vw, 32px);
        border: 1px solid #e5eaf2;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 18px 55px rgb(34 54 88 / 10%);
      }

      .field {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-size: 0.9rem;
        font-weight: 650;
      }

      .input-wrap {
        position: relative;
      }

      input {
        width: 100%;
        min-height: 50px;
        padding: 12px 48px 12px 14px;
        border: 1px solid #d8dfeb;
        border-radius: 10px;
        outline: none;
        background: #fff;
        color: #17243b;
        font: inherit;
        font-size: 1rem;
        transition: border-color 150ms ease, box-shadow 150ms ease;
      }

      input:focus {
        border-color: #527fe0;
        box-shadow: 0 0 0 3px rgb(82 127 224 / 16%);
      }

      input::placeholder {
        color: #a1aabc;
      }

      .suffix {
        position: absolute;
        top: 50%;
        right: 15px;
        color: #748098;
        font-size: 0.9rem;
        pointer-events: none;
        transform: translateY(-50%);
      }

      .hint {
        margin: 7px 0 0;
        color: #77839a;
        font-size: 0.78rem;
      }

      .actions {
        display: flex;
        gap: 10px;
        margin-top: 26px;
      }

      button {
        min-height: 48px;
        border: 0;
        border-radius: 10px;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        transition: background-color 150ms ease, transform 150ms ease;
      }

      button:active {
        transform: translateY(1px);
      }

      button:focus-visible {
        outline: 3px solid #91aff2;
        outline-offset: 3px;
      }

      .calculate {
        flex: 1;
        background: #416fe0;
        color: white;
      }

      .calculate:hover {
        background: #315dca;
      }

      .reset {
        padding: 0 18px;
        background: #eef2f8;
        color: #44516a;
      }

      .reset:hover {
        background: #e2e8f1;
      }

      .results {
        margin-top: 24px;
        padding: 20px;
        border: 1px solid #dcebe8;
        border-radius: 12px;
        background: #f3faf8;
      }

      .results[hidden] {
        display: none;
      }

      .results h2 {
        margin: 0 0 16px;
        font-size: 1rem;
      }

      .result-row {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 10px 0;
        color: #58667d;
        font-size: 0.9rem;
      }

      .result-row + .result-row {
        border-top: 1px solid #dcebe8;
      }

      .result-value {
        color: #17243b;
        font-size: 1rem;
        font-weight: 750;
        font-variant-numeric: tabular-nums;
      }

      .result-row:last-child .result-value {
        color: #16836d;
      }

      .formula {
        margin: 18px 0 0;
        color: #77839a;
        font-size: 0.78rem;
        line-height: 1.5;
        text-align: center;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Plan with clarity</p>
      <h1>Simple Interest Calculator</h1>
      <p class="intro">Estimate the interest earned or paid over time.</p>

      <section class="calculator" aria-label="Simple interest calculator">
        <form id="calculator-form">
          <div class="field">
            <label for="principal">Principal amount</label>
            <div class="input-wrap">
              <input id="principal" name="principal" type="number" min="0" step="any" inputmode="decimal" placeholder="e.g. 10,000" required>
              <span class="suffix" aria-hidden="true">amount</span>
            </div>
            <p class="hint">The starting amount before interest.</p>
          </div>

          <div class="field">
            <label for="rate">Annual interest rate</label>
            <div class="input-wrap">
              <input id="rate" name="rate" type="number" min="0" step="any" inputmode="decimal" placeholder="e.g. 5" required>
              <span class="suffix" aria-hidden="true">%</span>
            </div>
          </div>

          <div class="field">
            <label for="time">Time period</label>
            <div class="input-wrap">
              <input id="time" name="time" type="number" min="0" step="any" inputmode="decimal" placeholder="e.g. 3" required>
              <span class="suffix" aria-hidden="true">years</span>
            </div>
          </div>

          <div class="actions">
            <button class="calculate" type="submit">Calculate interest</button>
            <button class="reset" type="reset">Reset</button>
          </div>
        </form>

        <section id="results" class="results" aria-labelledby="results-title" aria-live="polite" hidden>
          <h2 id="results-title">Your estimate</h2>
          <div class="result-row">
            <span>Simple interest</span>
            <output id="interest" class="result-value" for="principal rate time"></output>
          </div>
          <div class="result-row">
            <span>Total amount</span>
            <output id="total" class="result-value" for="principal rate time"></output>
          </div>
        </section>
      </section>

      <p class="formula">Simple interest = principal × annual rate × time ÷ 100</p>
    </main>

    <script>
      const form = document.querySelector("#calculator-form");
      const results = document.querySelector("#results");
      const interestOutput = document.querySelector("#interest");
      const totalOutput = document.querySelector("#total");
      const numberFormat = new Intl.NumberFormat(undefined, {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2,
      });

      form.addEventListener("submit", (event) => {
        event.preventDefault();

        if (!form.reportValidity()) {
          return;
        }

        const principal = Number(form.elements.principal.value);
        const rate = Number(form.elements.rate.value);
        const time = Number(form.elements.time.value);
        const interest = principal * rate * time / 100;
        const total = principal + interest;

        if (!Number.isFinite(interest) || !Number.isFinite(total)) {
          form.elements.principal.setCustomValidity("Please enter values that produce a valid result.");
          form.reportValidity();
          form.elements.principal.setCustomValidity("");
          return;
        }

        interestOutput.textContent = numberFormat.format(interest);
        totalOutput.textContent = numberFormat.format(total);
        results.hidden = false;
      });

      form.addEventListener("input", () => {
        results.hidden = true;
      });

      form.addEventListener("reset", () => {
        results.hidden = true;
      });
    </script>
  </body>
</html>
